---
# Offenses that predate the adoption of the voxpupuli-rubocop ruleset are
# excluded here rather than fixed, to avoid a mass style rewrite that would
# obliterate git history and conflict with open PRs. New code outside these
# exclusions must comply.

Layout/FirstHashElementIndentation:
  Exclude:
    - 'spec/**/*'

Layout/HashAlignment:
  Exclude:
    - 'spec/**/*'

Layout/IndentationConsistency:
  Exclude:
    - 'spec/**/*'

Layout/LeadingEmptyLines:
  Exclude:
    - 'spec/**/*'

Layout/LineLength:
  Exclude:
    - 'spec/**/*'

Lint/RedundantDirGlobSort:
  Exclude:
    - 'spec/**/*'

Naming/HeredocDelimiterNaming:
  Exclude:
    - 'spec/**/*'

Performance/CollectionLiteralInLoop:
  Exclude:
    - 'spec/**/*'

RSpec/ContextWording:
  Exclude:
    - 'spec/**/*'

RSpec/DescribeClass:
  Exclude:
    - 'spec/**/*'

RSpec/EmptyLineAfterExample:
  Exclude:
    - 'spec/**/*'

RSpec/EmptyLineAfterExampleGroup:
  Exclude:
    - 'spec/**/*'

RSpec/EmptyLineAfterFinalLet:
  Exclude:
    - 'spec/**/*'

RSpec/ExampleLength:
  Exclude:
    - 'spec/**/*'

RSpec/ExampleWording:
  Exclude:
    - 'spec/**/*'

RSpec/ExcessiveDocstringSpacing:
  Exclude:
    - 'spec/**/*'

RSpec/HookArgument:
  Exclude:
    - 'spec/**/*'

RSpec/ImplicitExpect:
  Exclude:
    - 'spec/**/*'

RSpec/ImplicitSubject:
  Exclude:
    - 'spec/**/*'

RSpec/LeakyLocalVariable:
  Exclude:
    - 'spec/**/*'

RSpec/MatchWithSimpleRegex:
  Exclude:
    - 'spec/**/*'

RSpec/NamedSubject:
  Exclude:
    - 'spec/**/*'

RSpec/NestedGroups:
  Exclude:
    - 'spec/**/*'

RSpec/NoExpectationExample:
  Exclude:
    - 'spec/**/*'

RSpec/Output:
  Exclude:
    - 'spec/**/*'

RSpec/RepeatedExampleGroupBody:
  Exclude:
    - 'spec/**/*'

RSpec/RepeatedExampleGroupDescription:
  Exclude:
    - 'spec/**/*'

Style/AndOr:
  Exclude:
    - 'spec/**/*'

Style/CommentedKeyword:
  Exclude:
    - 'spec/**/*'

Style/Dir:
  Exclude:
    - 'spec/**/*'

Style/FileWrite:
  Exclude:
    - 'spec/**/*'

Style/FrozenStringLiteralComment:
  Exclude:
    - 'rakelib/local.rake'
    - 'spec/**/*'

Style/HashEachMethods:
  Exclude:
    - 'spec/**/*'

Style/HashSyntax:
  Exclude:
    - 'rakelib/local.rake'
    - 'spec/**/*'

Style/IfUnlessModifier:
  Exclude:
    - 'spec/**/*'

Style/MixinUsage:
  Exclude:
    - 'spec/**/*'

Style/RegexpLiteral:
  Exclude:
    - 'spec/**/*'

Style/RescueStandardError:
  Exclude:
    - 'spec/**/*'

Style/TrailingCommaInHashLiteral:
  Exclude:
    - 'spec/**/*'

Style/WordArray:
  Exclude:
    - 'spec/**/*'

Style/YAMLFileRead:
  Exclude:
    - 'spec/**/*'
